services:
  - type: web
    name: trustscore-api
    env: python
    pythonVersion: "3.11"
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: CORS_ALLOW_ORIGINS
        value: "https://trustscore-ai.netlify.app"
